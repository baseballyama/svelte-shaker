# Compile the Rust crates on every change to them.
#
# The engine core (`engine-rs`) and the native napi scanner (`engine-scan-native`)
# are built only by the release / prebuild workflows, so the main CI never touched
# them. That let a napi/napi-derive version skew (#127) silently break a fresh
# `cargo build` — it shipped unnoticed because the published binaries predated the
# bump. This job compiles both crates on every Rust change so that can't recur.
#
# Path-filtered so it runs only when the crates (or this file) change; it is not a
# required check for JS-only PRs.
name: CI (Rust)

on:
  push:
    branches: [main]
    paths:
      - 'packages/svelte-shaker/engine-rs/**'
      - 'packages/svelte-shaker/engine-scan-native/**'
      - 'packages/svelte-shaker/tests/native-*.test.ts'
      - 'packages/svelte-shaker/tests/ir-parity.test.ts'
      - 'packages/svelte-shaker/tests/vite.test.ts'
      - 'packages/svelte-shaker/tests/module-callsite-vite.test.ts'
      - 'packages/svelte-shaker/tests/native-addon.ts'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    paths:
      - 'packages/svelte-shaker/engine-rs/**'
      - 'packages/svelte-shaker/engine-scan-native/**'
      - 'packages/svelte-shaker/tests/native-*.test.ts'
      - 'packages/svelte-shaker/tests/ir-parity.test.ts'
      - 'packages/svelte-shaker/tests/vite.test.ts'
      - 'packages/svelte-shaker/tests/module-callsite-vite.test.ts'
      - 'packages/svelte-shaker/tests/native-addon.ts'
      - '.github/workflows/ci-rust.yml'
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  rust:
    name: Cargo build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Building the native scanner compiles the engine-rs rlib AND the napi
      # cdylib — the exact combination the napi skew broke.
      - name: Build native scanner
        working-directory: packages/svelte-shaker/engine-scan-native
        run: cargo build --release

      - name: Check native scanner size
        working-directory: packages/svelte-shaker/engine-scan-native
        run: node scripts/check-binary-size.cjs

      # The engine core's own unit tests run standalone (no rsvelte dep here).
      - name: Test engine core
        working-directory: packages/svelte-shaker/engine-rs
        run: cargo test --release

      # Run the native byte-identity tests against the freshly built addon, so a Rust
      # change that breaks native/JS parity fails HERE. The main `pnpm test` (ci.yml)
      # runs these too, but there the addon isn't built, so they skipIf(!addon) — an
      # assertion-free green. Building the addon above (its `target/release` cdylib is
      # what `index.cjs` loads) makes them actually execute; the guard below fails loudly
      # if the addon still didn't load, so the suite can never silently skip green.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 — version comes from package.json "packageManager"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard — the native addon must load
        working-directory: packages/svelte-shaker
        run: >
          node -e "const a=require('./engine-scan-native/index.cjs');
          if(typeof a.ShakeSession!=='function'||typeof a.parseFiles!=='function'){
          console.error('native addon failed to load — the byte-identity tests would skip green');
          process.exit(1);}"
      - name: Native byte-identity tests
        working-directory: packages/svelte-shaker
        run: >
          pnpm exec vitest run
          tests/native-engine.test.ts
          tests/native-full-shake.test.ts
          tests/native-parse-files.test.ts
          tests/ir-parity.test.ts
          tests/vite.test.ts
          tests/module-callsite-vite.test.ts
