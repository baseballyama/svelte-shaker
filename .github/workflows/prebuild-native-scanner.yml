# Build the optional native prop-scanner (`svelte-shaker-engine-scan-native`) for
# every published platform and publish it to npm as a single package that bundles
# all platform `.node` binaries (loaded by `index.cjs`).
#
# rsvelte (the cargo git dependency) is PUBLIC, so the build fetches it without any
# credentials. Publishing is TOKENLESS via npm Trusted Publishing (OIDC) — no repo
# secret. It needs: `id-token: write`, npm >= 11.5.1 (we upgrade it), and the package's
# Trusted Publisher registered on npm (this repo + this workflow filename). A 404 on
# the `/-/npm/v1/oidc/token/exchange` request means that registration is missing/wrong.
#
# Trigger manually (workflow_dispatch) or by pushing a
# `svelte-shaker-engine-scan-native@*` tag.
name: Prebuild + publish native scanner

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm after building (otherwise just upload artifacts)'
        type: boolean
        default: false
  push:
    tags:
      - 'svelte-shaker-engine-scan-native@*'

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `napi` = the `${process.platform}-${process.arch}` tag the loader
          # (`index.cjs`) looks for first.
          - host: macos-latest
            target: x86_64-apple-darwin
            napi: darwin-x64
          - host: macos-latest
            target: aarch64-apple-darwin
            napi: darwin-arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            napi: linux-x64
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            napi: linux-arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            napi: win32-x64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/svelte-shaker/engine-scan-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # aarch64 linux needs a cross linker.
      - name: Install aarch64 linux toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # `cargo build` produces the napi cdylib directly — `build.rs` runs
      # `napi_build::setup()` — so we don't need @napi-rs/cli and dodge any CLI
      # version/flag drift. Then rename the cdylib to the platform `.node` the
      # loader resolves.
      - name: Build addon
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename cdylib to a platform .node
        shell: bash
        run: |
          rel="target/${{ matrix.target }}/release"
          # `find` (unlike a multi-glob `ls`) doesn't error under `set -e` when an
          # extension is absent on this OS.
          bin=$(find "$rel" -maxdepth 1 -type f \
            \( -name 'libsvelte_shaker_engine_scan_native.dylib' \
            -o -name 'libsvelte_shaker_engine_scan_native.so' \
            -o -name 'svelte_shaker_engine_scan_native.dll' \) | head -n1)
          if [ -z "$bin" ]; then
            echo "no cdylib found in $rel"; ls -la "$rel"; exit 1
          fi
          node scripts/check-binary-size.cjs "$bin"
          out="svelte-shaker-engine-scan-native.${{ matrix.napi }}.node"
          echo "binary: $bin -> $out"
          cp "$bin" "$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/svelte-shaker/engine-scan-native/*.node
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm provenance + trusted publishing (no NPM_TOKEN)
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/svelte-shaker/engine-scan-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Do NOT set `registry-url` — it writes an (empty) `_authToken` into .npmrc and
      # forces token auth, blocking OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - name: Ensure OIDC-capable npm
        run: |
          npm install -g npm@latest
          npm --version

      # Collect every platform's `.node` next to index.cjs (the loader picks the
      # matching one at require time) and publish the single bundled package.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: packages/svelte-shaker/engine-scan-native/artifacts
      - name: Gather binaries
        run: |
          find artifacts -name '*.node' -exec cp {} . \;
          ls -la *.node

      # Tokenless publish via npm Trusted Publishing (OIDC). On failure, dump npm's
      # debug log (e.g. a 404 token exchange = the package's trusted publisher isn't
      # registered/matching for this repo+workflow).
      - name: Publish to npm (tokenless, OIDC)
        run: |
          npm publish --provenance --access public || {
            echo "================ npm debug log ================"
            cat "$HOME/.npm/_logs/"*-debug-0.log 2>/dev/null || true
            exit 1
          }
        env:
          NPM_CONFIG_PROVENANCE: 'true'
