# Temporary (not for main): fresh lock maintenance on a GitHub runner.
# Read-only token, no secrets, no publish. Lockfiles only, no install scripts.
name: Temporary fresh relock
on:
  push:
    branches: ['ci-tmp/relock-shaker-195']
permissions:
  contents: read
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Fresh pnpm lock (delete and re-resolve)
        run: |
          pnpm --version
          cp pnpm-lock.yaml "$RUNNER_TEMP/pnpm-before.yaml"
          rm pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
          diff -u "$RUNNER_TEMP/pnpm-before.yaml" pnpm-lock.yaml > "$RUNNER_TEMP/pnpm.diff" || true
          wc -l "$RUNNER_TEMP/pnpm.diff"; sha256sum pnpm-lock.yaml
      - name: Cargo lock maintenance (cargo update within the manifests)
        run: |
          for d in packages/svelte-shaker/engine-rs packages/svelte-shaker/engine-scan-native; do
            cp "$d/Cargo.lock" "$RUNNER_TEMP/$(basename $d)-before.lock"
            (cd "$d" && cargo update 2>&1 | tail -40)
            diff -u "$RUNNER_TEMP/$(basename $d)-before.lock" "$d/Cargo.lock" > "$RUNNER_TEMP/$(basename $d).diff" || true
            sha256sum "$d/Cargo.lock"
          done
      - name: Collect
        run: |
          mkdir -p out/engine-rs out/engine-scan-native
          cp pnpm-lock.yaml "$RUNNER_TEMP"/*.diff out/
          cp packages/svelte-shaker/engine-rs/Cargo.lock out/engine-rs/
          cp packages/svelte-shaker/engine-scan-native/Cargo.lock out/engine-scan-native/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relock
          path: out/
