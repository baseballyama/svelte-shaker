[package]
name = "svelte-shaker-engine"
version = "0.0.0"
edition = "2021"
publish = false
description = "Analysis + transform core for svelte-shaker (docs/RUST-MIGRATION.md M4+). Self-contained: analyzes a Svelte AST passed as JSON; no rsvelte_core build dependency. Linked as an rlib by engine-scan-native."

[dependencies]
serde_json = "1.0.150"
# ECMAScript-compliant f64 -> string (Number::toString, ECMA-262 §7.1.12.1).
# `format!("{n}")` diverges from JS at the fixed/exponential cutoffs (e.g. 1e21,
# 1e-7), which would make a folded number render differently than the unshaken
# component. ryu-js implements the spec algorithm. Same crate oxc/Boa use for this.
ryu-js = "1.0.3"
hashbrown = { version = "0.16.1", features = ["rayon"] }

# The embarrassingly-parallel per-file model build is fanned out across cores.
rayon = "1.12.0"
