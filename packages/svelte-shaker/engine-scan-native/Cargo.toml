[package]
name = "svelte-shaker-engine-scan-native"
version = "0.0.0"
edition = "2021"
publish = false
description = "Native (napi) prop-scanner for svelte-shaker: parses with rsvelte and runs the validated never-passed-props engine without crossing a JSON AST boundary."

[lib]
crate-type = ["cdylib"]

[dependencies]
# The `#[napi]` functions are synchronous and return JSON strings. `napi-derive`
# must track `napi`'s major: #127 bumped `napi` to v3 but left `napi-derive` at
# 2.16, whose macro emits v2 codegen (`bindgen_prelude::ctor`, the 4-arg
# `register_class`) that v3 no longer provides — a fresh `cargo build` fails. v3
# on both restores a matching pairing.
napi = { version = "3.11.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.0"
serde_json = { version = "1.0.150", features = ["preserve_order"] }
rayon = "1.12.0"

# rsvelte, used for BOTH parsing AND the monomorphization size proxy
# (`session::own_size` calls `rsvelte_core::compiler::compile` with client codegen —
# the same output `@rsvelte/compiler`'s `compile_client` produces), so the native gate
# never calls back into a JS compiler. `default-features = false` deliberately drops
# rsvelte's `native` feature (jemalloc / mimalloc global allocators) so this cdylib
# keeps the host/napi allocator; the client codegen path is not feature-gated, so it
# needs no extra deps.
#
# SIZE-PROXY PARITY: the gate must decide identically across the TS and native
# engines — the JS engines compute the proxy from `@rsvelte/compiler` (0.9.4) while
# native computes it from THIS crate, so their client codegen must agree byte-for-byte.
# This is `@rsvelte/compiler@0.9.4` plus an upstream Cargo-only submodule metadata
# fix. Its compiler source matches the published package byte-for-byte, and
# the corpus-wide differential tests enforce output parity. rsvelte is public, so
# cargo fetches it with no credentials. For local dev against a side-by-side checkout,
# override with a `[patch]` in a local `.cargo/config.toml` (uncommitted) pointing
# `rsvelte_core` at the path.
rsvelte_core = { git = "https://github.com/baseballyama/rsvelte", rev = "332b053725d90228c841759c1f236deb16b32f82", default-features = false }

# The Value-based analysis engine, reused verbatim (rlib): its
# `find_never_passed_props` is pinned byte-for-byte to the JS engine by the
# `native-never-passed` differential test, so the native path inherits that
# soundness for free.
svelte-shaker-engine = { path = "../engine-rs" }

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
# The napi methods intentionally catch parser/compiler panics and turn them into
# JavaScript errors or safe fallbacks. `abort` would make those guards ineffective.
panic = "unwind"

# rsvelte 0.9 uses oxc_formatter from git while its other oxc dependencies name
# crates.io releases. Cargo does not propagate a dependency's root `[patch]` table,
# so repeat rsvelte's release patch here to keep every oxc AST type from the same
# source revision.
[patch.crates-io]
oxc_allocator = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ast_macros = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_span = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_codegen = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_regular_expression = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_ecmascript = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_str = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
oxc_data_structures = { git = "https://github.com/oxc-project/oxc", rev = "83abe3b49c0913b1a984a7eec5e433a59fd76eae" }
